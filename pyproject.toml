[project]
name = "turnstile-solver"
version = "0.1.0"
description = "Self-hosted Cloudflare Turnstile solver HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "camoufox[geoip]>=0.4.11",
    "playwright<=1.61.0",
    "loguru>=0.7.3",
]

[project.scripts]
api = "src.main:run_api"
dev = "src.main:run_dev"
