services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnstile-solver
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
    volumes:
      - ./proxies.txt:/app/proxies.txt:ro
      - data:/home/appuser/.cache
    # Browsers need shared memory; default 64MB is too small
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homelabs

volumes:
  data:

networks:
  homelabs:
    external: true
